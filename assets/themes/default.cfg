# The Law Of Prey 主题配置
#
# 本文件只控制界面配色，是启动时自动加载的默认主题。
# 复制本文件、改颜色、另存为新的 .cfg，即可得到自己的主题；
# 同目录下的其他 .cfg 会被扫描并枚举，也可由 LoadTheme 按名加载。

# === 键（语义映射）===
#   background  控件背景色
#   line        边框、分隔线
#   text        正文文字
#   textDim     次要文字（禁用、弱化）
#   button      按钮底色
#   buttonText  按钮文字色
#   titleBar    box 标题栏底色
#   titleText   box 标题栏文字色

# === 格式 ===
#   - UTF-8 文本，一行一个 key = value
#   - # 或 ; 开头为注释
#   - 颜色写作 0xRRGGBBAA，RRGGBB 部分可省略（按不透明处理）
#   - 键名大小写不敏感，连字符与下划线等价：text-dim 等于 text_dim

# === 生效机制 ===
#   - 解析从内置默认配色（src/ui.c 的 kDefaultUiStyle）出发，
#     本文件只覆盖写到的键。
#   - 少写某个键 = 使用该键的内置默认色，不报错。因此玩家只需
#     复制本文件、改想改的几行、另存新名，即成一个新主题。
#   - 写错键名或颜色值非法：该行被忽略，向日志输出告警，
#     其余行照常生效。
#   - 整个文件没有一行有效配色：保持当前样式不变，
#     LoadTheme 返回 false。
#   - 解析先写入局部副本，文件整体有效才替换当前样式，
#     坏文件不会留下半套配色。

# === 程序独占键 ===
# 以下键由程序独占，写了会被忽略并告警（保护像素格对齐与中文渲染）：
#   text_size text_spacing text_line_spacing text_alignment
#   text_alignment_vertical text_padding border_width

# 以下值与 src/ui.c 的 kDefaultUiStyle 保持一致，两者互为权威副本，
# 修改任一侧须同步另一侧。

background  = 0xf5f5f5ff
line        = 0x90abb5ff
text        = 0x686868ff
textDim     = 0xaeb7b8ff
button      = 0xc9c9c9ff
buttonText  = 0x1a1a1aff
titleBar    = 0x5bb2d9ff
titleText   = 0xffffffff