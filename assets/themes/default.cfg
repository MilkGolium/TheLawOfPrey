# The Law Of Prey 主题配置
#
# 本文件只控制界面配色。把新的 .cfg 放进 assets/themes/ 后重启游戏，
# 即可在游戏内切换到该主题。
#
# 格式
#   - UTF-8 文本，一行一个 key = value
#   - # 或 ; 开头为注释
#   - 颜色写作 0xRRGGBBAA，RRGGBB 可省略 alpha（默认不透明）
#   - 键名大小写不敏感，连字符与下划线等价：border-normal 等于 border_normal
#   - 顶层键作用于所有控件；写在 [控件名] 节区内则只作用于该控件
#   - 未出现的键不会被重置，因此只写想改的项即可
#
# 节区名取自 raygui 控件：label button toggle slider progressbar
# checkbox combo dropdown textbox valuebox tabbar listview colorpicker
# scrollbar statusbar
#
# 以下键由程序独占，写了会被忽略并在日志中告警：
#   text_size text_spacing text_line_spacing text_alignment
#   text_alignment_vertical text_padding border_width
# 原因是这些项一旦被改动，界面的像素格对齐与中文渲染会被破坏。

# === 全局配色 ===
# 取值与 raygui 内置默认主题完全一致，作为可复制的起点。

border_normal   = 0x838383ff
base_normal     = 0xc9c9c9ff
text_normal     = 0x686868ff

border_focused  = 0x5bb2d9ff
base_focused    = 0xc9effeff
text_focused    = 0x6c9bbcff

border_pressed  = 0x0492c7ff
base_pressed    = 0x97e8ffff
text_pressed    = 0x368bafff

border_disabled = 0xb5c1c2ff
base_disabled   = 0xe6e9e9ff
text_disabled   = 0xaeb7b8ff

line            = 0x90abb5ff
background      = 0xf5f5f5ff

# === 控件覆盖示例 ===
# 取消注释即可只调整单个控件，其余部分沿用上面的全局值。

# [button]
# border_normal = 0x3a3a3aff
# base_normal   = 0xe0e0e0ff
# text_normal   = 0x1a1a1aff
