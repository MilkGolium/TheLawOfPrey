# The Law Of Prey 配置文件样例
#
# 本文件只是给人看的样本：程序既不创建它，也不读取它。
# 真正生效的是下面这张平台表里的位置：
#
#   macOS           $HOME/Library/Application Support/TheLawOfPrey/config.cfg
#   Linux / FreeBSD ${XDG_CONFIG_HOME:-$HOME/.config}/TheLawOfPrey/config.cfg
#
# 格式：每行一条 "键 = 值"，'#' 起注释（行内的 '#' 之后同样整段忽略），
# 允许空行与行尾空白，键名大小写敏感。
#
# 生效优先级：启动参数 > 配置文件 > 代码默认值。
# 例如 --lang 覆盖这里的 lang，--windowed 覆盖这里的 fullscreen。
#
# 本阶段程序只读配置，绝不写回：回写与注释保留等设置界面上线时再定。
# 因此改这个文件不会丢，它不会被程序动过。

# 是否进全屏。可选值 true / false，缺省 true。
fullscreen = true

# 目标帧数。整数，范围 30 到 240，缺省 144。
target_fps = 144

# 主题名。缺省 default，取值须是程序扫描到的主题之一（assets/themes 下
# 的 .cfg 文件名，不含扩展名），应用时校验，不认识就告警并保持默认。
theme = default

# 界面文案语言。缺省 zh-hans，取值须是程序认可的语言标识
# （zh-hans / en），应用时校验，不认识就告警并退回缺省。
lang = zh-hans
